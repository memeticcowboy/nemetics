# NEMA Meta-Harness Configuration
# This file defines the structural parameters of the harness.
# Runtime secrets go in .env; architecture goes here.

[harness]
name = "nemetics-meta-harness"
version = "0.1.0"
cycle = "NEMA"  # Noise → Extract → Modulate → Exchange

[harness.nema_phases]
# Each phase can route to a different model or use the same one.
# "default" means use MODEL_ADAPTER from .env
noise_model = "default"
extract_model = "default"
modulate_model = "default"
exchange_model = "default"

[harness.optimization]
# Meta-harness optimization settings (from Stanford/MIT research)
max_iterations = 50           # Per the paper: ~50 full evaluations per run
eval_set_size = 100           # Examples per evaluation run
median_files_per_iteration = 82  # Observed access pattern
credit_assignment = true      # Enable causal reasoning over traces

[vault]
# Knowledge corpus configuration
root = ".."                   # Relative to meta-harness/
include_patterns = [
  "**/*.md",
  "**/*.txt",
]
exclude_patterns = [
  "meta-harness/**",
  "NEMA_TERMINOLOGY_AUDIT.md",
  "node_modules/**",
  ".git/**",
  "site/**",
]

[vault.retrieval]
# RAG configuration
strategy = "hybrid"           # "keyword" | "semantic" | "hybrid"
keyword_weight = 0.4
semantic_weight = 0.6
max_results = 20              # Top-k results per query
chunk_size = 512              # Tokens per chunk
chunk_overlap = 64            # Token overlap between chunks

[vault.priority_files]
# Files that should always be available in context (loaded first)
always_load = [
  "memetic_ecology/8_REGIMES/regime.md",
  "Papers/SIML_Plain_English_Guide_v1.1.1.md",
  "memetic_ecology/CANONICAL_LEGEND.md",
  "CLAUDE.md",
]

[daemons]
# Elemental daemon configuration for multi-agent decomposition

[daemons.aerunik]
element = "Air"
operator = "σ"
greek = "χ"
function = "distinction"
system_prompt = """You are Aerunik, the Air daemon (σ/χ). Your function is distinction — cutting signal from noise. You discriminate, separate, make the first σ-cut. You do NOT resolve, synthesize, or conclude. You cut."""

[daemons.sentaria]
element = "Water"
operator = "ρ"
greek = "Q"
function = "relation"
system_prompt = """You are Sentaria, the Water daemon (ρ/Q). Your function is relation — feeling resonance and testing relational fit. You connect, couple, sense what belongs together. You do NOT cut, direct, or contain. You feel."""

[daemons.jvalion]
element = "Fire"
operator = "λ"
function = "direction"
system_prompt = """You are Jvalion, the Fire daemon (λ). Your function is direction — committed thrust toward a target. You aim, commit, vectorize. You do NOT hedge, branch, or dissolve. You burn toward the goal."""

[daemons.arboriel]
element = "Wood"
operator = "β"
function = "exploration"
system_prompt = """You are Arboriel, the Wood daemon (β). Your function is exploration — branching into possibility space. You diverge, sprout alternatives, follow tendrils. You do NOT converge, prune, or finalize. You grow."""

[daemons.humavita]
element = "Earth"
operator = "δγ"
function = "metabolism"
system_prompt = """You are Humavita, the Earth daemon (δγ). Your function is metabolism — composting and cycling. You break down, decompose, extract nutrients from decay. You do NOT build, create, or preserve. You compost."""

[daemons.ferrosid]
element = "Metal"
operator = "μ"
function = "boundary"
system_prompt = """You are Ferrosid, the Metal daemon (μ). Your function is boundary — forging containers and structural integrity. You contain, define edges, enforce limits. You do NOT flow, expand, or dissolve. You hold."""

[daemons.nema]
element = "Aether"
operator = "∮"
greek = "Z"
function = "synthesis"
system_prompt = """You are Nema, the Aether coordinator (∮/Z). You receive outputs from all six elemental daemons and produce the ∮ closed-traversal synthesis. You hold all tensions without collapsing to any single element. Your output is the integrated field — the answer that emerges from disagreement, not consensus."""

[traces]
# Execution trace format
format = "jsonl"              # Each trace is one JSON line
include_vault_access = true   # Log which vault files were accessed
include_token_counts = true   # Log token usage per phase
include_timing = true         # Log wall-clock time per phase
retention_days = 30           # Auto-prune traces older than this

[permissions]
# Auto-approve safe operations for local/offline use
auto_approve = [
  "file_read",
  "file_glob",
  "file_grep",
  "vault_search",
]
require_confirmation = [
  "file_write",
  "file_edit",
  "git_commit",
  "git_push",
  "bash_execute",
]
